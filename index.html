<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUTrack AI Pro · Next-Gen Academic OS</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- QRCode.js for real QR code generation -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #818cf8;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
      --secondary: #0ea5e9; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #3b82f6;
      --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-sidebar: #0f172a;
      --bg-card: #ffffff; --bg-glass: rgba(255,255,255,0.7);
      --text-primary: #0f172a; --text-secondary: #475569; --text-light: #94a3b8;
      --border-color: #e2e8f0; --border-light: #f1f5f9;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 24px rgba(0,0,0,0.12); --shadow-xl: 0 24px 48px rgba(0,0,0,0.18);
      --shadow-glow: 0 0 40px rgba(99,102,241,0.15);
      --radius: 14px; --radius-lg: 20px; --radius-full: 9999px;
      --sidebar-width: 280px; --sidebar-collapsed: 72px; --topbar-height: 76px;
      --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    [data-theme="dark"] {
      --bg-primary: #020617; --bg-secondary: #0f172a; --bg-sidebar: #020617;
      --bg-card: #1e293b; --bg-glass: rgba(15,23,42,0.7);
      --text-primary: #f8fafc; --text-secondary: #94a3b8; --text-light: #64748b;
      --border-color: #334155; --border-light: #1e293b;
      --shadow-glow: 0 0 40px rgba(99,102,241,0.25);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg-primary); color:var(--text-primary); transition:var(--transition); overflow:hidden; height:100vh; }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--primary-light); border-radius:var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background:var(--primary); }

    @keyframes fadeIn { from { opacity:0; transform:translateY(20px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes fadeInLeft { from { opacity:0; transform:translateX(-30px); } to { opacity:1; transform:translateX(0); } }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
    @keyframes slideUp { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }
    @keyframes pulse-glow { 0%,100% { box-shadow:0 0 0 0 rgba(99,102,241,0.4); } 50% { box-shadow:0 0 0 12px rgba(99,102,241,0); } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
    @keyframes gradient-shift { 0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; } }
    @keyframes typingBounce { 0%,80%,100% { transform:scale(0); } 40% { transform:scale(1); } }

    .animate-fadeIn { animation:fadeIn 0.5s cubic-bezier(0.4,0,0.2,1) forwards; }
    .animate-scaleIn { animation:scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .animate-float { animation:float 3s ease-in-out infinite; }
    .stagger-1 { animation-delay:0.05s; opacity:0; animation-fill-mode:forwards; }
    .stagger-2 { animation-delay:0.1s; opacity:0; animation-fill-mode:forwards; }
    .stagger-3 { animation-delay:0.15s; opacity:0; animation-fill-mode:forwards; }
    .stagger-4 { animation-delay:0.2s; opacity:0; animation-fill-mode:forwards; }
    .stagger-5 { animation-delay:0.25s; opacity:0; animation-fill-mode:forwards; }

    .hidden { display:none !important; }
    .flex { display:flex; } .flex-col { flex-direction:column; } .items-center { align-items:center; } .justify-between { justify-content:space-between; } .justify-center { justify-content:center; }
    .gap-1 { gap:4px; } .gap-2 { gap:8px; } .gap-3 { gap:12px; } .gap-4 { gap:16px; } .gap-6 { gap:24px; }
    .w-full { width:100%; } .h-full { height:100%; } .text-center { text-align:center; } .relative { position:relative; }

    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:10px 20px; border:none; border-radius:var(--radius); font-weight:600; font-size:13px;
      cursor:pointer; transition:var(--transition); text-decoration:none; position:relative; overflow:hidden;
      font-family:'Inter',sans-serif; letter-spacing:0.2px;
    }
    .btn-primary { background:var(--primary-gradient); color:white; box-shadow:0 4px 14px rgba(99,102,241,0.35); }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(99,102,241,0.45); }
    .btn-secondary { background:var(--bg-secondary); color:var(--text-primary); border:1.5px solid var(--border-color); }
    .btn-secondary:hover { background:var(--border-light); transform:translateY(-1px); }
    .btn-success { background:linear-gradient(135deg,#10b981,#059669); color:white; box-shadow:0 4px 14px rgba(16,185,129,0.3); }
    .btn-success:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(16,185,129,0.4); }
    .btn-danger { background:linear-gradient(135deg,#ef4444,#dc2626); color:white; }
    .btn-warning { background:linear-gradient(135deg,#f59e0b,#d97706); color:white; }
    .btn-ghost { background:transparent; color:var(--text-secondary); }
    .btn-ghost:hover { background:var(--bg-primary); color:var(--text-primary); }
    .btn-sm { padding:6px 14px; font-size:12px; border-radius:10px; } .btn-lg { padding:14px 28px; font-size:15px; } .btn-block { width:100%; }
    .btn-icon { width:40px; height:40px; padding:0; border-radius:12px; }

    .card {
      background:var(--bg-card); border-radius:var(--radius-lg); padding:24px;
      box-shadow:var(--shadow-sm); border:1px solid var(--border-color); transition:var(--transition); position:relative; overflow:hidden;
    }
    .card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--primary-gradient); opacity:0; transition:opacity 0.3s; }
    .card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
    .card:hover::before { opacity:1; }
    .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .card-title { font-size:16px; font-weight:700; color:var(--text-primary); display:flex; align-items:center; gap:10px; }
    .card-title i { color:var(--primary); font-size:18px; }
    .card-gradient { background:var(--primary-gradient); color:white; border:none; box-shadow:var(--shadow-glow); }
    .card-gradient .card-title { color:white; }

    .badge { display:inline-flex; align-items:center; gap:4px; padding:5px 12px; border-radius:var(--radius-full); font-size:11px; font-weight:700; letter-spacing:0.3px; }
    .badge-success { background:#d1fae5; color:#065f46; } .badge-warning { background:#fef3c7; color:#92400e; }
    .badge-danger { background:#fee2e2; color:#991b1b; } .badge-info { background:#dbeafe; color:#1e40af; }
    .badge-primary { background:#e0e7ff; color:#3730a3; } .badge-secondary { background:#f1f5f9; color:#475569; }
    [data-theme="dark"] .badge-success { background:#065f46; color:#d1fae5; }
    [data-theme="dark"] .badge-warning { background:#92400e; color:#fef3c7; }
    [data-theme="dark"] .badge-danger { background:#991b1b; color:#fee2e2; }
    [data-theme="dark"] .badge-info { background:#1e40af; color:#dbeafe; }
    [data-theme="dark"] .badge-primary { background:#3730a3; color:#e0e7ff; }

    .input {
      width:100%; padding:12px 16px; border:1.5px solid var(--border-color); border-radius:var(--radius);
      font-family:'Inter',sans-serif; font-size:14px; background:var(--bg-primary); color:var(--text-primary);
      transition:var(--transition); outline:none;
    }
    .input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(99,102,241,0.1); }
    .form-label { display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }
    .form-group { margin-bottom:16px; }

    .login-container {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      padding:20px; position:relative; overflow:hidden;
    }
    .login-bg-pattern { position:absolute; inset:0; opacity:0.05; background-image:radial-gradient(circle at 1px 1px, white 1px, transparent 0); background-size:40px 40px; }
    .login-orbs { position:absolute; width:600px; height:600px; border-radius:50%; background:radial-gradient(circle, rgba(99,102,241,0.3) 0%, transparent 70%); filter:blur(60px); animation:float 6s ease-in-out infinite; }
    .login-orbs:nth-child(1) { top:-200px; left:-200px; }
    .login-orbs:nth-child(2) { bottom:-200px; right:-200px; background:radial-gradient(circle, rgba(168,85,247,0.3) 0%, transparent 70%); animation-delay:3s; }
    .login-box {
      background:rgba(255,255,255,0.03); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08);
      border-radius:var(--radius-lg); padding:48px; max-width:440px; width:100%;
      box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); position:relative; z-index:1;
    }
    .login-box .logo { text-align:center; margin-bottom:36px; }
    .login-box .logo .logo-icon { width:64px; height:64px; border-radius:20px; background:var(--primary-gradient); display:inline-flex; align-items:center; justify-content:center; font-size:28px; color:white; margin-bottom:16px; box-shadow:0 8px 24px rgba(99,102,241,0.4); animation:float 3s ease-in-out infinite; }
    .login-box .logo h1 { font-size:30px; font-weight:800; color:white; font-family:'Space Grotesk',sans-serif; letter-spacing:-0.5px; }
    .login-box .logo p { color:rgba(255,255,255,0.5); font-size:14px; margin-top:4px; }
    .login-box .role-selector { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:24px; }
    .login-box .role-btn { padding:14px 8px; border:1.5px solid rgba(255,255,255,0.1); border-radius:var(--radius); background:rgba(255,255,255,0.03); cursor:pointer; text-align:center; transition:var(--transition); font-size:12px; font-weight:600; color:rgba(255,255,255,0.5); }
    .login-box .role-btn:hover { border-color:rgba(99,102,241,0.5); background:rgba(99,102,241,0.1); color:white; transform:translateY(-2px); }
    .login-box .role-btn.active { border-color:var(--primary); background:rgba(99,102,241,0.15); color:white; box-shadow:0 0 20px rgba(99,102,241,0.2); }
    .login-box .role-btn i { display:block; font-size:22px; margin-bottom:6px; }
    .login-box .form-group label { color:rgba(255,255,255,0.6); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; display:block; }
    .login-box .input { background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.1); color:white; }
    .login-box .input:focus { border-color:var(--primary-light); box-shadow:0 0 0 4px rgba(99,102,241,0.15); }
    .login-box .input::placeholder { color:rgba(255,255,255,0.25); }

    .app-container { display:flex; height:100vh; overflow:hidden; }
    .sidebar { width:var(--sidebar-width); background:var(--bg-sidebar); color:white; display:flex; flex-direction:column; flex-shrink:0; transition:var(--transition); overflow-y:auto; overflow-x:hidden; z-index:100; position:relative; border-right:1px solid rgba(255,255,255,0.04); }
    .sidebar-brand { padding:24px; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; gap:12px; }
    .sidebar-brand .brand-icon { width:42px; height:42px; border-radius:14px; background:var(--primary-gradient); display:flex; align-items:center; justify-content:center; font-size:20px; box-shadow:0 4px 12px rgba(99,102,241,0.3); flex-shrink:0; }
    .sidebar-brand h2 { font-size:20px; font-weight:800; font-family:'Space Grotesk',sans-serif; background:linear-gradient(135deg,#818cf8,#c4b5fd); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .sidebar-brand small { font-size:10px; color:rgba(255,255,255,0.35); font-weight:500; letter-spacing:0.5px; }
    .sidebar-nav { flex:1; padding:16px 12px; }
    .sidebar-nav .nav-section { font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:rgba(255,255,255,0.25); padding:20px 16px 8px; font-weight:700; }
    .sidebar-nav .nav-item { display:flex; align-items:center; gap:12px; padding:11px 16px; border-radius:12px; color:rgba(255,255,255,0.5); cursor:pointer; transition:var(--transition); text-decoration:none; font-size:13px; font-weight:600; margin-bottom:2px; position:relative; }
    .sidebar-nav .nav-item:hover { background:rgba(255,255,255,0.05); color:white; }
    .sidebar-nav .nav-item.active { background:linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.15)); color:white; box-shadow:0 2px 8px rgba(99,102,241,0.15); }
    .sidebar-nav .nav-item.active::before { content:''; position:absolute; left:0; top:50%; transform:translateY(-50%); width:3px; height:20px; background:var(--primary-light); border-radius:0 4px 4px 0; }
    .sidebar-nav .nav-item i { width:22px; text-align:center; font-size:17px; transition:transform 0.3s; }
    .sidebar-nav .nav-item:hover i { transform:scale(1.1); }
    .sidebar-nav .nav-item .nav-badge { margin-left:auto; background:var(--danger); color:white; font-size:9px; font-weight:700; padding:2px 7px; border-radius:var(--radius-full); min-width:18px; text-align:center; }
    .sidebar-footer { padding:16px; border-top:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; gap:12px; margin:12px; border-radius:var(--radius); background:rgba(255,255,255,0.03); transition:var(--transition); }
    .sidebar-footer:hover { background:rgba(255,255,255,0.05); }
    .sidebar-footer .avatar { width:38px; height:38px; border-radius:50%; background:var(--primary-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:white; flex-shrink:0; border:2px solid rgba(255,255,255,0.1); }
    .sidebar-footer .user-info { flex:1; min-width:0; }
    .sidebar-footer .user-info .name { font-size:13px; font-weight:700; color:white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sidebar-footer .user-info .role { font-size:10px; color:rgba(255,255,255,0.4); font-weight:500; text-transform:uppercase; letter-spacing:0.5px; }
    .sidebar-footer .theme-btn { width:32px; height:32px; border-radius:10px; border:none; background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.6); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:var(--transition); font-size:14px; }
    .sidebar-footer .theme-btn:hover { background:rgba(255,255,255,0.15); color:white; transform:rotate(20deg); }

    .main-content { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }
    .topbar { height:var(--topbar-height); background:var(--bg-secondary); border-bottom:1px solid var(--border-color); display:flex; align-items:center; justify-content:space-between; padding:0 28px; flex-shrink:0; backdrop-filter:blur(12px); z-index:50; }
    .topbar-left { display:flex; align-items:center; gap:16px; }
    .topbar-left .menu-toggle { display:none; background:none; border:none; font-size:22px; color:var(--text-primary); cursor:pointer; width:40px; height:40px; border-radius:12px; transition:var(--transition); }
    .topbar-left .menu-toggle:hover { background:var(--bg-primary); }
    .topbar-left .page-title { font-size:20px; font-weight:800; font-family:'Space Grotesk',sans-serif; letter-spacing:-0.3px; }
    .topbar-right { display:flex; align-items:center; gap:14px; }
    .topbar-right .search-bar { display:flex; align-items:center; background:var(--bg-primary); border:1.5px solid var(--border-color); border-radius:var(--radius-full); padding:8px 18px; gap:10px; transition:var(--transition); width:280px; }
    .topbar-right .search-bar:focus-within { border-color:var(--primary); box-shadow:0 0 0 4px rgba(99,102,241,0.08); width:320px; }
    .topbar-right .search-bar input { border:none; background:none; outline:none; font-family:'Inter',sans-serif; font-size:13px; color:var(--text-primary); width:100%; }
    .topbar-right .search-bar i { color:var(--text-light); font-size:14px; }
    .topbar-right .icon-btn { width:42px; height:42px; border-radius:12px; border:none; background:var(--bg-primary); color:var(--text-secondary); cursor:pointer; transition:var(--transition-bounce); display:flex; align-items:center; justify-content:center; position:relative; font-size:17px; border:1.5px solid var(--border-color); }
    .topbar-right .icon-btn:hover { background:var(--primary); color:white; border-color:var(--primary); transform:translateY(-2px) scale(1.05); box-shadow:0 4px 12px rgba(99,102,241,0.3); }
    .topbar-right .icon-btn .badge-dot { position:absolute; top:8px; right:8px; width:9px; height:9px; background:var(--danger); border-radius:50%; border:2px solid var(--bg-secondary); box-shadow:0 0 0 2px var(--danger); animation:pulse-glow 2s infinite; }
    .view-switcher { display:flex; align-items:center; gap:8px; padding:6px 12px; background:var(--bg-primary); border:1.5px solid var(--border-color); border-radius:var(--radius-full); font-size:12px; font-weight:600; }
    .view-switcher select { border:none; background:none; outline:none; font-family:'Inter',sans-serif; font-size:12px; font-weight:700; color:var(--primary); cursor:pointer; }

    .page-content { flex:1; overflow-y:auto; padding:28px; }

    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; margin-bottom:28px; }
    .stat-card { background:var(--bg-card); border-radius:var(--radius-lg); padding:24px; border:1px solid var(--border-color); transition:var(--transition); position:relative; overflow:hidden; }
    .stat-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); }
    .stat-card .stat-icon { width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:16px; transition:transform 0.3s; }
    .stat-card:hover .stat-icon { transform:scale(1.1) rotate(-5deg); }
    .stat-card .stat-icon.purple { background:linear-gradient(135deg,#e0e7ff,#c7d2fe); color:#4338ca; }
    .stat-card .stat-icon.blue { background:linear-gradient(135deg,#dbeafe,#bfdbfe); color:#1d4ed8; }
    .stat-card .stat-icon.green { background:linear-gradient(135deg,#d1fae5,#a7f3d0); color:#047857; }
    .stat-card .stat-icon.orange { background:linear-gradient(135deg,#fef3c7,#fde68a); color:#b45309; }
    .stat-card .stat-icon.red { background:linear-gradient(135deg,#fee2e2,#fecaca); color:#b91c1c; }
    .stat-card .stat-label { font-size:12px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px; }
    .stat-card .stat-value { font-size:32px; font-weight:800; margin:6px 0; font-family:'Space Grotesk',sans-serif; letter-spacing:-1px; }
    .stat-card .stat-change { font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px; }
    .stat-card .stat-change.up { color:var(--success); } .stat-card .stat-change.down { color:var(--danger); }

    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px; }
    .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:24px; }

    .table-container { overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border-color); }
    .table-container table { width:100%; border-collapse:separate; border-spacing:0; }
    .table-container th { text-align:left; padding:14px 20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-secondary); background:var(--bg-primary); border-bottom:2px solid var(--border-color); position:sticky; top:0; z-index:1; }
    .table-container td { padding:14px 20px; border-bottom:1px solid var(--border-light); font-size:13.5px; font-weight:500; }
    .table-container tr { transition:background 0.2s; }
    .table-container tbody tr:hover td { background:var(--bg-primary); }
    .table-container tbody tr:last-child td { border-bottom:none; }
    .table-container .td-name { display:flex; align-items:center; gap:12px; }
    .table-container .td-avatar { width:36px; height:36px; border-radius:50%; background:var(--primary-gradient); display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:13px; flex-shrink:0; }
    .table-container .td-info { display:flex; flex-direction:column; }
    .table-container .td-info .name { font-weight:700; color:var(--text-primary); }
    .table-container .td-info .sub { font-size:12px; color:var(--text-light); font-weight:500; }

        };
        DB.students.push(newStudent);
        return { success: true, student: newStudent, user: DB.users[DB.users.length - 1] };
      }
    };

    // ===================== TOAST & NOTIFICATIONS =====================
    function showToast(message,type='info',title=null) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle' };
      const titles = { success:'Success', error:'Error', warning:'Warning', info:'Info' };
      toast.innerHTML = `
        <div class="toast-icon"><i class="fas ${icons[type]||icons.info}"></i></div>
        <div class="toast-content"><div class="toast-title">${title || titles[type] || 'Notification'}</div><div class="toast-desc">${message}</div></div>
        <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
      `;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity='0'; toast.style.transform='translateX(100px)'; setTimeout(()=>toast.remove(),300); }, 5000);
    }
    function openNotifications() {
      document.getElementById('notif-panel').classList.add('open');
      document.getElementById('overlay').style.display='flex';
      const list = document.getElementById('notif-list');
      const user = API.getCurrentUser();
      if (!user) return;
      const notifs = API.getNotifications(user.id) || [];
      if (notifs.length===0) { list.innerHTML='<div class="empty-state"><div class="empty-icon"><i class="fas fa-bell-slash"></i></div><h4>No notifications</h4><p>You are all caught up!</p></div>'; return; }
      list.innerHTML = notifs.map(n => `
        <div class="notif-item ${n.read?'':'unread'}" onclick="markNotification('${n.id}')">
          <div class="notif-icon ${n.type==='SUCCESS'?'success':n.type==='ATTENDANCE'?'warning':n.type==='INTERVENTION'?'danger':'info'}"><i class="fas ${n.type==='ASSESSMENT'?'fa-pencil-alt':n.type==='ATTENDANCE'?'fa-calendar-check':n.type==='SUCCESS'?'fa-trophy':n.type==='INTERVENTION'?'fa-exclamation-triangle':'fa-bell'}"></i></div>
          <div class="notif-content"><div class="title">${n.title} ${n.read?'':'<span class="badge badge-primary" style="font-size:8px;padding:2px 6px;">NEW</span>'}</div><div class="desc">${n.message}</div><div class="time">${new Date(n.createdAt).toLocaleString()}</div></div>
        </div>
      `).join('');
    }
    function closeNotifications() { document.getElementById('notif-panel').classList.remove('open'); document.getElementById('overlay').style.display='none'; }
    function markNotification(id) { API.markNotificationRead(id); openNotifications(); }

    // ===================== UTILITY COMPONENTS =====================
    function AnimatedNumber({ value, suffix='', duration=1000 }) {
      const [display, setDisplay] = useState(0);
      useEffect(() => {
        let start = 0; const end = value; const startTime = Date.now();
        const animate = () => {
          const elapsed = Date.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeOut = 1 - Math.pow(1 - progress, 3);
          setDisplay(Math.round(start + (end - start) * easeOut));
          if (progress < 1) requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
      }, [value, duration]);
      return <span>{display}{suffix}</span>;
    }

    function StatCard({ icon, iconClass, label, value, change, changeType, suffix='', delay=0 }) {
      return (
        <div className={`stat-card animate-fadeIn stagger-${delay}`}>
          <div className={`stat-icon ${iconClass}`}><i className={`fas ${icon}`}></i></div>
          <div className="stat-label">{label}</div>
          <div className="stat-value"><AnimatedNumber value={value} suffix={suffix} /></div>
          {change !== undefined && (
            <div className={`stat-change ${changeType}`}>
              <i className={`fas fa-arrow-${changeType==='up'?'up':'down'}`}></i> {Math.abs(change)}% from last month
            </div>
          )}
        </div>
      );
    }

    function Modal({ isOpen, onClose, title, children, footer }) {
      useEffect(() => {
        if (!isOpen) return;
        const handleEsc = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', handleEsc);
        document.body.style.overflow = 'hidden';
        return () => { document.removeEventListener('keydown', handleEsc); document.body.style.overflow = ''; };
      }, [isOpen, onClose]);
      if (!isOpen) return null;
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><h3>{title}</h3><button className="btn btn-ghost btn-icon" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">{children}</div>
            {footer && <div className="modal-footer">{footer}</div>}
          </div>
        </div>
      );
    }

    function EmptyState({ icon, title, description }) {
      return (
        <div className="empty-state">
          <div className="empty-icon"><i className={`fas ${icon}`}></i></div>
          <h4>{title}</h4><p>{description}</p>
        </div>
      );
    }

    function Login({ onLogin }) {

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!email.trim()) { setError('Email is required'); showToast('Email is required','error'); return; }
        if (!password.trim()) { setError('Password is required'); showToast('Password is required','error'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError('Please enter a valid email'); showToast('Please enter a valid email','error'); return; }
        setLoading(true); setError('');
        setTimeout(() => {

            </div>
            <div className="card animate-fadeIn stagger-5">
              <div className="card-header"><h3 className="card-title"><i class="fas fa-history"></i> Recent Activity</h3></div>
              <div className="timeline">
                {recentActivity.map((act,i)=> (
                  <div key={i} className={`timeline-item ${act.type}`}>
                    <div className="time">{act.time}</div>
                    <div className="content">{act.text}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );

      if (effectiveRole==='TEACHER') return (
        <div>
          <div className="stats-grid">
            <StatCard icon="fa-users" iconClass="purple" label="Total Students" value={stats?.totalStudents||0} change={8} changeType="up" delay={1} />
            <StatCard icon="fa-calendar-check" iconClass="green" label="Avg Attendance" value={stats?.avgAttendance||0} suffix="%" delay={2} />
            <StatCard icon="fa-pencil-alt" iconClass="blue" label="Avg Quiz Score" value={stats?.avgQuiz||0} suffix="%" delay={3} />
            <StatCard icon="fa-exclamation-triangle" iconClass="red" label="Need Attention" value={stats?.critical||0} delay={4} />
          </div>
          <div className="grid-2">
            <div className="card animate-fadeIn stagger-2">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-brain"></i> AI Insights</h3><button className="btn btn-sm btn-primary" onClick={()=>navigateTo('action-center')}>View All</button></div>
              {suggestions.length>0 ? suggestions.map((s,i)=> (
                <div key={i} className={`action-card ${s.priority==='CRITICAL'?'critical':'attention'}`}>
                  <div className="action-header"><strong>{s.studentName}</strong> <span className={`badge ${s.priority==='CRITICAL'?'badge-danger':'badge-warning'}`}>{s.priority}</span></div>
                  <div className="action-reason">{s.reason}</div>
                  <div className="action-evidence">{s.evidence}</div>
                </div>
              )) : <EmptyState icon="fa-check-circle" title="All clear!" description="No students need attention right now" />}
            </div>
            <div className="card animate-fadeIn stagger-3">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-bullhorn"></i> Recent Announcements</h3></div>
              {announcements.map((a,i)=> (
                <div key={i} style={{padding:'10px 0',borderBottom:i<announcements.length-1?'1px solid var(--border-light)':'none'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                    <span className={`badge ${a.priority==='HIGH'?'badge-danger':'badge-info'}`}>{a.priority}</span>
                    <span style={{fontWeight:700,fontSize:'14px'}}>{a.title}</span>
                  </div>
                  <p style={{fontSize:'13px',color:'var(--text-secondary)',marginTop:'4px'}}>{a.content}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      return (
        <div>
          <div className="stats-grid">
            <StatCard icon="fa-users" iconClass="purple" label="Students" value={stats?.totalStudents||0} change={12} changeType="up" delay={1} />
            <StatCard icon="fa-chalkboard-teacher" iconClass="blue" label="Teachers" value={stats?.totalTeachers||0} delay={2} />
            <StatCard icon="fa-book" iconClass="green" label="Subjects" value={stats?.totalSubjects||0} delay={3} />
            <StatCard icon="fa-school" iconClass="orange" label="Classes" value={stats?.totalClasses||0} delay={4} />
          </div>
          <div className="grid-2">
            <div className="card card-gradient animate-fadeIn stagger-2">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-server"></i> System Status</h3></div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px'}}>
                <div style={{padding:'16px',background:'rgba(255,255,255,0.1)',borderRadius:'12px',textAlign:'center'}}>
                  <div style={{fontSize:'32px',fontWeight:800}}>99.9%</div>
                  <div style={{fontSize:'12px',opacity:0.8,marginTop:'4px'}}>Uptime</div>
                </div>
                <div style={{padding:'16px',background:'rgba(255,255,255,0.1)',borderRadius:'12px',textAlign:'center'}}>
                  <div style={{fontSize:'32px',fontWeight:800}}>45ms</div>
                  <div style={{fontSize:'12px',opacity:0.8,marginTop:'4px'}}>Latency</div>
                </div>
              </div>
              <div style={{marginTop:'16px',display:'flex',gap:'8px',flexWrap:'wrap'}}>
                <span className="badge badge-success"><i className="fas fa-check"></i> Database: Online</span>
                <span className="badge badge-success"><i className="fas fa-check"></i> AI Engine: Active</span>
                <span className="badge badge-success"><i className="fas fa-check"></i> Notifications: Running</span>
              </div>
            </div>
            <div className="card animate-fadeIn stagger-3">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-bullhorn"></i> Recent Announcements</h3><button className="btn btn-sm btn-primary" onClick={()=>navigateTo('announcements')}>Manage</button></div>
              {announcements.map((a,i)=> (
                <div key={i} style={{padding:'10px 0',borderBottom:i<announcements.length-1?'1px solid var(--border-light)':'none'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                    <span className={`badge ${a.priority==='HIGH'?'badge-danger':'badge-info'}`}>{a.priority}</span>
                    <span style={{fontWeight:700,fontSize:'14px'}}>{a.title}</span>
                  </div>
                  <p style={{fontSize:'13px',color:'var(--text-secondary)',marginTop:'4px'}}>{a.content}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ===================== ATTENDANCE (with Real QR) =====================
    function AttendancePage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [activeTab, setActiveTab] = useState('overview');
      const [qrActive, setQrActive] = useState(false);
      const [qrSession, setQrSession] = useState(null);
      const [timer, setTimer] = useState(120);
      const [scanResult, setScanResult] = useState(null);
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [selectedClass, setSelectedClass] = useState('cls1');
      const [selectedSubject, setSelectedSubject] = useState('sub1');
      const [showScanConfirm, setShowScanConfirm] = useState(false);
      const [activeSessions, setActiveSessions] = useState([]);
      const [newStudent, setNewStudent] = useState({name:'', phone:'', email:'', gender:'Male', classId:'cls1', departmentId:'d1', guardian:'', guardianPhone:'', address:''});
      const [addResult, setAddResult] = useState(null);
      const [scanningSessionId, setScanningSessionId] = useState(null);
      const [qrGenerated, setQrGenerated] = useState(false);

      const student = API.getStudentByUserId(user.id) || (effectiveRole==='STUDENT' && role!=='STUDENT' ? API.getDemoStudent() : null);
      const teacher = API.getTeacherByUserId(user.id);
      const qrContainerRef = useRef(null);

      // Poll for active QR sessions (for students)
      useEffect(() => {
        if (effectiveRole !== 'STUDENT') return;
        const poll = () => {
          const sessions = API.getActiveQRSessions(student?.classId);
          setActiveSessions(sessions || []);
        };
        poll();
        const interval = setInterval(poll, 3000);
        return () => clearInterval(interval);
      }, [effectiveRole, student]);

      // Teacher QR timer
      const timerRef = useRef(null);
      useEffect(() => {
        if (qrActive && timer > 0) {
          timerRef.current = setInterval(() => setTimer(t => { 
            if (t <= 1) { 
              clearInterval(timerRef.current); 
              setQrActive(false); 
              setQrSession(null); 
              setQrGenerated(false);
              showToast('QR session expired','warning'); 
              return 0; 
            } 
            return t - 1; 
          }), 1000);
        }
        return () => { if (timerRef.current) clearInterval(timerRef.current); };
      }, [qrActive]);

      // Generate QR code when session starts
      useEffect(() => {
        if (qrActive && qrSession && qrContainerRef.current && !qrGenerated) {
          qrContainerRef.current.innerHTML = '';
          
          try {
            const qrData = JSON.stringify({
              sessionId: qrSession.id,
              classId: qrSession.classId,
              subjectId: qrSession.subjectId,
              teacherId: qrSession.teacherId,
              expiresAt: qrSession.expiresAt
            });
            
            if (typeof QRCode !== 'undefined') {
              new QRCode(qrContainerRef.current, {
                text: qrData,
                width: 200,
                height: 200,
                colorDark: '#6366f1',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
              });
              setQrGenerated(true);
            } else {
              qrContainerRef.current.innerHTML = `
                <div style="width:200px;height:200px;background:var(--primary-gradient);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;color:white;flex-direction:column;gap:8px;">
                  <i class="fas fa-qrcode" style="font-size:64px;"></i>
                  <span style="font-size:14px;">QR Code</span>
                  <span style="font-size:10px;opacity:0.7;">Session: ${qrSession.id.slice(-6)}</span>
                </div>
              `;
              showToast('QRCode library not loaded, using fallback','warning');
            }
          } catch (err) {
            console.error('QR generation error:', err);
            qrContainerRef.current.innerHTML = `
              <div style="width:200px;height:200px;background:#fee2e2;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#991b1b;flex-direction:column;gap:8px;border:2px solid #ef4444;">
                <i class="fas fa-exclamation-circle" style="font-size:48px;"></i>
                <span style="font-size:14px;">Error generating QR</span>
              </div>
            `;
            showToast('Error generating QR code','error');
          }
        }
      }, [qrActive, qrSession, qrGenerated]);

      // Start QR Session (Teacher)
      const startQR = () => {
        if (!selectedClass || !selectedSubject) { 
          showToast('Please select class and subject','error'); 
          return; 
        }
        const existing = DB.qrSessions.find(s => s.active && new Date(s.expiresAt) > new Date() && s.classId === selectedClass);
        if (existing) {
          showToast('An active QR session already exists for this class. Wait for it to expire.','warning');
          return;
        }
        
        const session = API.createQRSession(teacher?.id||'t1', selectedClass, selectedSubject);
        setQrSession(session); 
        setQrActive(true); 
        setTimer(120); 
        setScanResult(null);
        setQrGenerated(false);
        showToast('📱 QR Session started! Students can scan now.', 'success');
      };

      // Open scan confirmation dialog (Student)
      const openScanConfirm = (session) => {
        if (!student) { 
          showToast('Student profile not found','error'); 
          return; 
        }
        setScanningSessionId(session.id);
        setShowScanConfirm(true);
        setScanResult(null);
      };

      // Confirm scan and mark attendance (Student)
      const confirmScan = () => {
        if (!scanningSessionId || !student) { 
          showToast('Invalid session','error'); 
          return; 
        }
        
        const session = DB.qrSessions.find(s => s.id === scanningSessionId);
        if (!session) {
          showToast('QR session not found','error');
          setShowScanConfirm(false);
          return;
        }
        
        if (new Date(session.expiresAt) < new Date()) {
          showToast('⏰ QR session has expired!','error');
          setShowScanConfirm(false);
          setActiveSessions(activeSessions.filter(s => s.id !== scanningSessionId));
          return;
        }
        
        const result = API.scanQR(scanningSessionId, student.id);
        setShowScanConfirm(false);
        if (result.success) {
          const sub = API.getSubjectById(session.subjectId);
          setScanResult({
            status:'success', 
            message:`✅ Attendance recorded for ${student.name}!`, 
            details: `📚 ${sub?.name || 'Subject'} | ${new Date().toLocaleDateString()}`
          });
          const updated = API.getActiveQRSessions(student?.classId);
          setActiveSessions(updated);
          showToast(`✅ Attendance recorded for ${student.name}!`, 'success');
        } else {
          setScanResult({
            status:'error', 
            message:`❌ ${result.error}`
          });
          showToast(result.error, 'error');
        }
        setTimeout(()=>setScanResult(null),8000);
      };

      const handleBulkAttendance = (studentId, status) => {
        if (!selectedSubject) { showToast('Please select a subject','error'); return; }
        API.markAttendance(studentId, selectedSubject, selectedDate, status, teacher?.id||'t1');
        showToast(`Attendance marked: ${status}`,'success');
      };

      const handleAddStudent = () => {
        if (!newStudent.name.trim()) { showToast('Student name is required','error'); return; }
        if (!newStudent.phone.trim()) { showToast('Phone number is required','error'); return; }
        if (newStudent.phone.length < 10) { showToast('Phone number must be at least 10 digits','error'); return; }
        const result = API.addStudent(newStudent);
        if (result.success) {
          setAddResult(result);
          showToast(`Student added! Roll No: ${result.student.rollNo}`,'success');
          setNewStudent({name:'', phone:'', email:'', gender:'Male', classId:'cls1', departmentId:'d1', guardian:'', guardianPhone:'', address:''});
          setTimeout(()=>setAddResult(null),5000);
        } else {
          showToast('Failed to add student','error');
        }
      };

      const attendanceRecords = student ? API.getAttendance(student.id) : [];
      const stats = student ? (API.getAttendanceStats(student.id) || {}) : {};

      // STUDENT VIEW
      if (effectiveRole==='STUDENT') return (
        <div>
          <div className="stats-grid">
            <StatCard icon="fa-calendar-check" iconClass="green" label="Overall" value={stats.percentage||0} suffix="%" delay={1} />
            <StatCard icon="fa-check" iconClass="purple" label="Present" value={stats.present||0} delay={2} />
            <StatCard icon="fa-clock" iconClass="orange" label="Late" value={stats.late||0} delay={3} />
            <StatCard icon="fa-times" iconClass="red" label="Absent" value={stats.absent||0} delay={4} />
          </div>
          <div className="grid-2">
            <div className="card animate-fadeIn stagger-2">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-qrcode"></i> Scan QR Attendance</h3></div>
              {activeSessions.length > 0 ? (
                <div>
                  <p style={{color:'var(--text-secondary)',marginBottom:'16px',fontSize:'14px'}}>
                    <i className="fas fa-info-circle" style={{color:'var(--primary)'}}></i> {activeSessions.length} active QR session(s) found.
                  </p>
                  {activeSessions.map((session, idx) => {
                    const sub = API.getSubjectById(session.subjectId);
                    const cls = API.getClassById(session.classId);
                    const timeLeft = Math.max(0, Math.floor((new Date(session.expiresAt) - new Date()) / 1000));
                    return (
                      <div key={idx} style={{padding:'16px',background:'var(--bg-primary)',borderRadius:'12px',marginBottom:'12px',border:'2px solid var(--primary)'}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}>
                          <span style={{fontWeight:700,fontSize:'15px'}}><i className="fas fa-book" style={{color:'var(--primary)'}}></i> {sub?.name || 'Subject'}</span>
                          <span className="badge badge-success" style={{animation:'pulse-glow 2s infinite'}}><i className="fas fa-circle" style={{fontSize:'8px'}}></i> Active</span>
                        </div>
                        <div style={{fontSize:'13px',color:'var(--text-secondary)',marginBottom:'12px'}}>
                          Class: {cls?.name} · Expires in <strong>{Math.floor(timeLeft/60)}:{(timeLeft%60).toString().padStart(2,'0')}</strong>
                        </div>
                        <button className="btn btn-primary btn-block" onClick={()=>openScanConfirm(session)} style={{fontSize:'15px',padding:'12px'}}>
                          <i className="fas fa-camera"></i> Scan & Confirm Attendance
                        </button>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div style={{textAlign:'center',padding:'40px 20px'}}>
                  <div style={{width:'120px',height:'120px',background:'var(--bg-primary)',borderRadius:'16px',border:'2px dashed var(--border-color)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}>
                    <i className="fas fa-qrcode" style={{fontSize:'48px',color:'var(--text-light)',opacity:0.5}}></i>
                  </div>
                  <p style={{color:'var(--text-secondary)',fontSize:'15px'}}>No active QR sessions found.</p>
                  <p style={{color:'var(--text-light)',fontSize:'13px',marginTop:'4px'}}>Your teacher hasn't started a QR attendance session yet.</p>
                </div>
              )}
              {scanResult && (
                <div style={{marginTop:'16px',padding:'16px 20px',borderRadius:'12px',background:scanResult.status==='success'?'#d1fae5':'#fee2e2',border:`2px solid ${scanResult.status==='success'?'#10b981':'#ef4444'}`}}>
                  <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
                    <i className={`fas fa-${scanResult.status==='success'?'check-circle':'exclamation-circle'}`} style={{fontSize:'24px',color:scanResult.status==='success'?'#065f46':'#991b1b'}}></i>
                    <div>
                      <div style={{fontWeight:700,color:scanResult.status==='success'?'#065f46':'#991b1b',fontSize:'15px'}}>{scanResult.message}</div>
                      {scanResult.details && <div style={{fontSize:'13px',color:'var(--text-secondary)'}}>{scanResult.details}</div>}
                    </div>
                  </div>
                </div>
              )}
            </div>
            <div className="card animate-fadeIn stagger-3">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-history"></i> Recent Records</h3></div>
              <div className="table-container">
                <table><thead><tr><th>Date</th><th>Subject</th><th>Status</th></tr></thead>
                <tbody>{(attendanceRecords || []).slice(0,8).map((a,i)=> (
                  <tr key={i}><td>{a.date}</td><td>{API.getSubjectById(a.subjectId)?.code || 'N/A'}</td>
                  <td><span className={`badge ${a.status==='PRESENT'?'badge-success':a.status==='LATE'?'badge-warning':'badge-danger'}`}>{a.status}</span></td></tr>
                ))}</tbody>
                </table>
              </div>
            </div>
          </div>

          {showScanConfirm && (
            <Modal isOpen={showScanConfirm} onClose={()=>setShowScanConfirm(false)} title="📸 Confirm Attendance" footer={
              <><button className="btn btn-secondary" onClick={()=>setShowScanConfirm(false)}>Cancel</button>
              <button className="btn btn-success" onClick={confirmScan} style={{fontSize:'15px',padding:'12px 24px'}}><i className="fas fa-check"></i> Confirm & Mark Present</button></>
            }>
              <div style={{textAlign:'center',padding:'20px'}}>
                <div style={{width:'80px',height:'80px',borderRadius:'50%',background:'var(--primary-gradient)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',fontSize:'32px',color:'white'}}><i className="fas fa-user-check"></i></div>
                <h3 style={{marginBottom:'8px'}}>Verify Your Identity</h3>
                <p style={{color:'var(--text-secondary)',marginBottom:'20px'}}>Confirm your details before marking attendance.</p>
                <div style={{background:'var(--bg-primary)',borderRadius:'12px',padding:'16px',textAlign:'left',marginBottom:'16px',border:'1px solid var(--border-color)'}}>
                  <div style={{marginBottom:'10px',display:'flex',justifyContent:'space-between'}}>
                    <span style={{color:'var(--text-light)',fontSize:'12px',textTransform:'uppercase',letterSpacing:'0.5px'}}>Name</span>
                    <div style={{fontWeight:700}}>{student?.name}</div>
                  </div>
                  <div style={{marginBottom:'10px',display:'flex',justifyContent:'space-between'}}>
                    <span style={{color:'var(--text-light)',fontSize:'12px',textTransform:'uppercase',letterSpacing:'0.5px'}}>Roll Number</span>
                    <div style={{fontWeight:700}}>{student?.rollNo}</div>
                  </div>
                  <div style={{marginBottom:'10px',display:'flex',justifyContent:'space-between'}}>
                    <span style={{color:'var(--text-light)',fontSize:'12px',textTransform:'uppercase',letterSpacing:'0.5px'}}>Email</span>
                    <div style={{fontWeight:700}}>{user?.email}</div>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between'}}>
                    <span style={{color:'var(--text-light)',fontSize:'12px',textTransform:'uppercase',letterSpacing:'0.5px'}}>Class</span>
                    <div style={{fontWeight:700}}>{API.getClassById(student?.classId)?.name}</div>
                  </div>
                </div>
                <div style={{background:'#dbeafe',borderRadius:'8px',padding:'12px',fontSize:'13px',color:'#1e40af'}}>
                  <i className="fas fa-shield-alt"></i> Your attendance will be recorded with timestamp verification.
                </div>
              </div>
            </Modal>
          )}
        </div>
      );

      // TEACHER / ADMIN VIEW
      return (
        <div>
          <div className="tabs">
            <button className={`tab ${activeTab==='overview'?'active':''}`} onClick={()=>setActiveTab('overview')}>Overview</button>
            <button className={`tab ${activeTab==='mark'?'active':''}`} onClick={()=>setActiveTab('mark')}>Mark Attendance</button>
            <button className={`tab ${activeTab==='qr'?'active':''}`} onClick={()=>setActiveTab('qr')}>QR Manager</button>
            <button className={`tab ${activeTab==='students'?'active':''}`} onClick={()=>setActiveTab('students')}>Add Students</button>
          </div>

          {activeTab==='overview' && (
            <div className="card animate-fadeIn">
              <div className="card-header"><h3 className="card-title">Attendance Overview</h3></div>
              <div className="table-container">
                <table><thead><tr><th>Student</th><th>Roll No</th><th>Overall %</th><th>Present</th><th>Absent</th><th>Status</th></tr></thead>
                <tbody>{(API.getStudents() || []).map(s=>{ const st=API.getAttendanceStats(s.id); return (
                  <tr key={s.id}><td className="td-name"><div className="td-avatar">{s.name.charAt(0)}</div><div className="td-info"><span className="name">{s.name}</span><span className="sub">{API.getClassById(s.classId)?.name}</span></div></td>
                  <td>{s.rollNo}</td><td><div className="progress-bar" style={{width:'80px',display:'inline-block',marginRight:'8px',verticalAlign:'middle'}}><div className={`fill ${(st.percentage||0)>80?'success':(st.percentage||0)>70?'warning':'danger'}`} style={{width:`${st.percentage||0}%`}}></div></div> {st.percentage||0}%</td>
                  <td>{st.present||0}</td><td>{st.absent||0}</td>
                  <td><span className={`badge ${(st.percentage||0)>=75?'badge-success':'badge-danger'}`}>{(st.percentage||0)>=75?'✅ Good':'⚠️ At Risk'}</span></td></tr>
                );})}</tbody>
                </table>
              </div>
            </div>
          )}

          {activeTab==='mark' && (
            <div className="card animate-fadeIn">
              <div className="card-header"><h3 className="card-title">Mark Attendance - {new Date(selectedDate).toDateString()}</h3></div>
              <div style={{marginBottom:'20px',display:'flex',gap:'12px',flexWrap:'wrap'}}>
                <input type="date" className="input" style={{width:'auto'}} value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} />
                <select className="input" style={{width:'auto'}} value={selectedClass} onChange={e=>setSelectedClass(e.target.value)}>
                  {(API.getClasses() || []).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
                <select className="input" style={{width:'auto'}} value={selectedSubject} onChange={e=>setSelectedSubject(e.target.value)}>
                  {(API.getSubjects() || []).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </div>
              <div className="table-container">
                <table><thead><tr><th>Student</th><th>Roll No</th><th>Mark Status</th></tr></thead>
                <tbody>{(API.getStudents() || []).filter(s=>s.classId===selectedClass).map(s=> {
                  const todayRec = API.getAttendance(s.id,null,selectedDate);
                  const currentStatus = todayRec.length>0 ? todayRec[0].status : null;
                  return (
                    <tr key={s.id}><td className="td-name"><div className="td-avatar">{s.name.charAt(0)}</div><div className="td-info"><span className="name">{s.name}</span></div></td>
                    <td>{s.rollNo}</td>

                  <select className="input" style={{width:'auto',minWidth:'160px'}} value={selectedClass} onChange={e=>setSelectedClass(e.target.value)}>
                    {(API.getClasses() || []).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                  <select className="input" style={{width:'auto',minWidth:'200px'}} value={selectedSubject} onChange={e=>setSelectedSubject(e.target.value)}>

                </button>
                {qrActive && qrSession && (
                  <div style={{marginTop:'32px'}}>
                    <div ref={qrContainerRef} style={{display:'flex',justifyContent:'center',marginBottom:'16px'}}></div>
                    <div className="qr-timer">{Math.floor(timer/60)}:{(timer%60).toString().padStart(2,'0')}</div>
                    <p style={{color:'var(--text-secondary)',fontSize:'15px'}}>

                      <span className="badge badge-info" style={{padding:'6px 14px',fontSize:'12px'}}><i className="fas fa-users"></i> Class: {API.getClassById(selectedClass)?.name}</span>
                      <span className="badge badge-primary" style={{padding:'6px 14px',fontSize:'12px'}}><i className="fas fa-book"></i> {API.getSubjectById(selectedSubject)?.name}</span>
                      <span className="badge badge-warning" style={{padding:'6px 14px',fontSize:'12px'}}><i className="fas fa-clock"></i> Expires in {Math.floor(timer/60)}:{(timer%60).toString().padStart(2,'0')}</span>

                {!qrActive && !qrSession && (

                    <p style={{color:'var(--text-light)',fontSize:'14px'}}>Click "Start QR Session" to generate a scannable QR code</p>

                  <div className="form-group"><label className="form-label">Email (optional)</label><input className="input" placeholder="Auto-generated if empty" value={newStudent.email} onChange={e=>setNewStudent({...newStudent,email:e.target.value})} /></div>
                  <div className="grid-2">

                  </div>
                  <div className="form-group"><label className="form-label">Department *</label><select className="input" value={newStudent.departmentId} onChange={e=>setNewStudent({...newStudent,departmentId:e.target.value})}>{(API.getDepartments()||[]).map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div>
                  <div className="form-group"><label className="form-label">Guardian Name</label><input className="input" placeholder="Parent/Guardian name" value={newStudent.guardian} onChange={e=>setNewStudent({...newStudent,guardian:e.target.value})} /></div>
                  <div className="form-group"><label className="form-label">Guardian Phone</label><input className="input" placeholder="Parent/Guardian phone" value={newStudent.guardianPhone} onChange={e=>setNewStudent({...newStudent,guardianPhone:e.target.value})} /></div>
                  <div className="form-group"><label className="form-label">Address</label><input className="input" placeholder="Student address" value={newStudent.address} onChange={e=>setNewStudent({...newStudent,address:e.target.value})} /></div>

                        <div style={{marginBottom:'10px',display:'flex',justifyContent:'space-between'}}>
                          <span style={{color:'var(--text-light)',fontSize:'12px',textTransform:'uppercase'}}>Name</span>
                          <div style={{fontWeight:700}}>{addResult.student.name}</div>
                        </div>
                        <div style={{marginBottom:'10px',display:'flex',justifyContent:'space-between'}}>
                          <span style={{color:'var(--text-light)',fontSize:'12px',textTransform:'uppercase'}}>Roll Number</span>
                          <div style={{fontWeight:700,color:'var(--primary)',fontSize:'18px'}}>{addResult.student.rollNo}</div>

                        <div style={{marginBottom:'10px',display:'flex',justifyContent:'space-between'}}>
                          <span style={{color:'var(--text-light)',fontSize:'12px',textTransform:'uppercase'}}>Email</span>

                      </div>
                      <p style={{fontSize:'13px',color:'var(--text-light)',marginTop:'12px'}}><i className="fas fa-info-circle"></i> Student can login with email and password: <strong>password</strong></p>

                  ) : (
                    <div style={{textAlign:'center',padding:'40px 20px'}}>
                      <i className="fas fa-user-graduate" style={{fontSize:'48px',color:'var(--text-light)',marginBottom:'16px',opacity:0.5}}></i>
                      <h4 style={{fontWeight:700,marginBottom:'6px'}}>No Student Added Yet</h4>
                      <p style={{color:'var(--text-secondary)',fontSize:'14px'}}>Fill the form and click "Add Student" to generate roll number automatically.</p>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

      );

    // ===================== TIMETABLE =====================
    function TimetablePage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [selectedClass, setSelectedClass] = useState('cls1');
      const [selectedDay, setSelectedDay] = useState('Monday');
      const [showAddModal, setShowAddModal] = useState(false);
      const [newEntry, setNewEntry] = useState({ day:'Monday', subjectId:'', teacherId:'', time:'', room:'', type:'LECTURE' });
      const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const entries = API.getTimetable(selectedClass, selectedDay) || [];
      const canEdit = effectiveRole==='ADMIN' || effectiveRole==='TEACHER';

      const addEntry = () => {
        if (!newEntry.subjectId || !newEntry.teacherId || !newEntry.time || !newEntry.room) {
          showToast('Please fill all fields','error','Validation Error'); return;
        }
        if (!/^\d{1,2}:\d{2}-\d{1,2}:\d{2}$/.test(newEntry.time)) {
          showToast('Time must be in format HH:MM-HH:MM','error','Invalid Time'); return;
        }
        API.addTimetableEntry({ classId:selectedClass, ...newEntry });
        setShowAddModal(false); setNewEntry({ day:'Monday', subjectId:'', teacherId:'', time:'', room:'', type:'LECTURE' });
        showToast('Timetable entry added successfully','success');
      };

      const deleteEntry = (id) => { if (confirm('Are you sure you want to delete this timetable entry?')) { API.deleteTimetableEntry(id); showToast('Entry deleted','info'); } };

      return (
        <div>
          <div style={{display:'flex',gap:'12px',flexWrap:'wrap',marginBottom:'24px',alignItems:'center'}}>
            <select className="input" style={{width:'auto',minWidth:'160px'}} value={selectedClass} onChange={e=>setSelectedClass(e.target.value)}>
              {(API.getClasses() || []).map(c=><option key={c.id} value={c.id}>{c.name} - {(API.getDepartmentById(c.department)?.code) || c.department}</option>)}
            </select>
            <div className="tabs" style={{margin:0}}>
              {days.map(d=><button key={d} className={`tab ${selectedDay===d?'active':''}`} onClick={()=>setSelectedDay(d)}>{d.slice(0,3)}</button>)}
            </div>
            {canEdit && <button className="btn btn-primary btn-sm" onClick={()=>setShowAddModal(true)} style={{marginLeft:'auto'}}><i className="fas fa-plus"></i> Add Entry</button>}
          </div>
          <div className="card animate-fadeIn">
            <div className="card-header"><h3 className="card-title">{selectedDay} - {API.getClasses().find(c=>c.id===selectedClass)?.name}</h3></div>
            {entries && entries.length>0 ? (
              <div className="table-container">
                <table><thead><tr><th>Time</th><th>Subject</th><th>Teacher</th><th>Room</th><th>Type</th>{canEdit&&<th>Action</th>}</tr></thead>
                <tbody>{entries.sort((a,b)=>a.time.localeCompare(b.time)).map(e=> {
                  const sub = API.getSubjectById(e.subjectId);
                  const teacher = API.getTeachers().find(t=>t.id===e.teacherId);
                  return (
                    <tr key={e.id}><td><span className="badge badge-primary">{e.time}</span></td>
                    <td><strong>{sub?.name || 'Unknown'}</strong><div style={{fontSize:'12px',color:'var(--text-light)'}}>{sub?.code}</div></td>
                    <td>{teacher?.name || 'N/A'}</td><td>{e.room}</td>
                    <td><span className={`badge ${e.type==='LAB'?'badge-warning':'badge-info'}`}>{e.type}</span></td>
                    {canEdit&&<td><button className="btn btn-sm btn-danger" onClick={()=>deleteEntry(e.id)}><i className="fas fa-trash"></i></button></td>}</tr>
                  );
                })}</tbody>
                </table>
              </div>
            ) : <EmptyState icon="fa-calendar-times" title="No classes" description={`No timetable entries for ${selectedDay}`} />}
          </div>
          {showAddModal && (
            <Modal isOpen={showAddModal} onClose={()=>setShowAddModal(false)} title="Add Timetable Entry" footer={<><button className="btn btn-secondary" onClick={()=>setShowAddModal(false)}>Cancel</button><button className="btn btn-primary" onClick={addEntry}><i className="fas fa-plus"></i> Add Entry</button></>}>
              <div className="form-group"><label className="form-label">Day</label><select className="input" value={newEntry.day} onChange={e=>setNewEntry({...newEntry,day:e.target.value})}>{days.map(d=><option key={d}>{d}</option>)}</select></div>
              <div className="form-group"><label className="form-label">Subject</label><select className="input" value={newEntry.subjectId} onChange={e=>setNewEntry({...newEntry,subjectId:e.target.value})}><option value="">Select Subject</option>{(API.getSubjects() || []).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
              <div className="form-group"><label className="form-label">Teacher</label><select className="input" value={newEntry.teacherId} onChange={e=>setNewEntry({...newEntry,teacherId:e.target.value})}><option value="">Select Teacher</option>{(API.getTeachers() || []).map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></div>
              <div className="form-group"><label className="form-label">Time Slot</label><input className="input" placeholder="e.g. 09:00-10:30" value={newEntry.time} onChange={e=>setNewEntry({...newEntry,time:e.target.value})} /></div>
              <div className="form-group"><label className="form-label">Room</label><input className="input" placeholder="e.g. L-301" value={newEntry.room} onChange={e=>setNewEntry({...newEntry,room:e.target.value})} /></div>
              <div className="form-group"><label className="form-label">Type</label><select className="input" value={newEntry.type} onChange={e=>setNewEntry({...newEntry,type:e.target.value})}><option>LECTURE</option><option>LAB</option><option>TUTORIAL</option></select></div>
            </Modal>
          )}
        </div>
      );
    }

    // ===================== CURRICULUM =====================
    function CurriculumPage({ role, viewAs }) {
      const [selectedSubject, setSelectedSubject] = useState('sub1');
      const [expandedUnit, setExpandedUnit] = useState(null);
      const subjects = API.getSubjects();
      const curriculum = API.getCurriculum(selectedSubject) || [];
      const grouped = curriculum.reduce((acc,item)=>{ if(!acc[item.unit]) acc[item.unit]=[]; acc[item.unit].push(item); return acc; },{});

      return (
        <div>
          <div style={{display:'flex',gap:'12px',flexWrap:'wrap',marginBottom:'24px'}}>
            {subjects.map(s=> (
              <button key={s.id} className={`btn btn-${selectedSubject===s.id?'primary':'secondary'} btn-sm`} onClick={()=>{setSelectedSubject(s.id); setExpandedUnit(null);}}>
                {s.name} <span className="badge badge-secondary" style={{marginLeft:'6px'}}>{s.code}</span>
              </button>
            ))}
          </div>
          <div className="grid-2">
            {Object.entries(grouped).map(([unit,items])=> (
              <div key={unit} className="card animate-fadeIn">
                <div className="card-header" style={{cursor:'pointer'}} onClick={()=>setExpandedUnit(expandedUnit===unit?null:unit)}>
                  <h3 className="card-title"><i className="fas fa-layer-group"></i> Unit {unit}</h3>
                  <i className={`fas fa-chevron-${expandedUnit===unit?'up':'down'}`} style={{color:'var(--text-light)'}}></i>
                </div>
                <div style={{display:expandedUnit===unit||expandedUnit===null?'block':'none'}}>
                  {items.map((c,i)=> (
                    <div key={c.id} style={{padding:'14px 0',borderBottom:i<items.length-1?'1px solid var(--border-light)':'none'}}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px'}}>
                        <span style={{fontWeight:700,fontSize:'14px'}}>{c.order}. {c.title}</span>
                        <span className="badge badge-secondary">{c.duration}</span>
                      </div>
                      <p style={{color:'var(--text-secondary)',fontSize:'13px',marginBottom:'10px'}}>{c.description}</p>
                      <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
                        <div className="progress-bar" style={{flex:1}}><div className="fill primary" style={{width:`${Math.floor(Math.random()*30+70)}%`}}></div></div>
                        <span style={{fontSize:'12px',color:'var(--text-light)',fontWeight:600}}>{c.resources} resources</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ===================== QUIZ =====================
    function QuizPage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [selectedQuiz, setSelectedQuiz] = useState(null);
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore] = useState(null);
      const [timeLeft, setTimeLeft] = useState(0);
      const [activeTab, setActiveTab] = useState('available');
      const student = API.getStudentByUserId(user.id) || (effectiveRole==='STUDENT' && role!=='STUDENT' ? API.getDemoStudent() : null);
      const quizzes = API.getQuizzes();

      useEffect(() => {
        let interval;
        if (selectedQuiz && !submitted && timeLeft > 0) {
          interval = setInterval(() => setTimeLeft(t=>{ if(t<=1){ submitQuiz(); return 0; } return t-1; }), 1000);
        }
        return () => clearInterval(interval);
      }, [selectedQuiz, submitted, timeLeft]);

      const handleAnswer = (qId, oi) => setAnswers({...answers, [qId]: oi});

      const submitQuiz = () => {
        if (!selectedQuiz) return;
        let correct=0; selectedQuiz.questions.forEach(q=>{ if(answers[q.id]===q.answer) correct++; });
        const pct=Math.round((correct/selectedQuiz.questions.length)*100); setScore(pct); setSubmitted(true);
        showToast(`Quiz submitted! Score: ${pct}%`, pct>=60?'success':'warning');
        if (student) {
          DB.quizAttempts.push({ id:`qa-${Date.now()}`, studentId:student.id, quizId:selectedQuiz.id, score:pct, total:selectedQuiz.questions.length, date:new Date().toISOString().split('T')[0], timeTaken:selectedQuiz.duration*60-timeLeft });
          const att=DB.quizAttempts.filter(a=>a.studentId===student.id);
          student.quizAverage=att.length>0?Math.round(att.reduce((s,a)=>s+a.score,0)/att.length):0;
        }
      };

      const startQuiz = (quiz) => { setSelectedQuiz(quiz); setSubmitted(false); setAnswers({}); setScore(null); setTimeLeft(quiz.duration*60); };

      if (effectiveRole==='STUDENT') {
        const myAttempts = student ? API.getQuizAttempts(student.id) : [];
        return (
          <div>
            <div className="stats-grid">
              <StatCard icon="fa-pencil-alt" iconClass="purple" label="Quizzes Taken" value={myAttempts.length} delay={1} />
              <StatCard icon="fa-percentage" iconClass="green" label="Average Score" value={student?.quizAverage||0} suffix="%" delay={2} />
              <StatCard icon="fa-trophy" iconClass="orange" label="Best Score" value={myAttempts.length>0?Math.max(...myAttempts.map(a=>a.score)):0} suffix="%" delay={3} />
            </div>
            <div className="tabs">
              <button className={`tab ${activeTab==='available'?'active':''}`} onClick={()=>setActiveTab('available')}>Available</button>
              <button className={`tab ${activeTab==='history'?'active':''}`} onClick={()=>setActiveTab('history')}>History</button>
            </div>
            {activeTab==='available' && !selectedQuiz && (
              <div className="grid-2">{quizzes.filter(q=>q.published).map(q=> (
                <div key={q.id} className="card animate-fadeIn">
                  <div className="card-header"><h3 className="card-title">{q.title}</h3><span className={`badge ${q.difficulty==='Easy'?'badge-success':q.difficulty==='Medium'?'badge-warning':'badge-danger'}`}>{q.difficulty}</span></div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'12px',marginBottom:'16px'}}>
                    <div style={{textAlign:'center',padding:'10px',background:'var(--bg-primary)',borderRadius:'10px'}}><div style={{fontWeight:800}}>{q.questions.length}</div><div style={{fontSize:'11px',color:'var(--text-light)'}}>Questions</div></div>
                    <div style={{textAlign:'center',padding:'10px',background:'var(--bg-primary)',borderRadius:'10px'}}><div style={{fontWeight:800}}>{q.duration}</div><div style={{fontSize:'11px',color:'var(--text-light)'}}>Minutes</div></div>
                    <div style={{textAlign:'center',padding:'10px',background:'var(--bg-primary)',borderRadius:'10px'}}><div style={{fontWeight:800}}>{q.marks}</div><div style={{fontSize:'11px',color:'var(--text-light)'}}>Marks</div></div>
                  </div>
                  <button className="btn btn-primary btn-block" onClick={()=>startQuiz(q)}><i className="fas fa-play"></i> Start Quiz</button>
                </div>
              ))}</div>
            )}
            {selectedQuiz && !submitted && (
              <div className="card animate-fadeIn">
                <div className="card-header">
                  <h3 className="card-title">{selectedQuiz.title}</h3>
                  <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
                    <span className="badge badge-danger" style={{fontSize:'14px',padding:'6px 14px'}}><i className="fas fa-clock"></i> {Math.floor(timeLeft/60)}:{(timeLeft%60).toString().padStart(2,'0')}</span>
                    <button className="btn btn-ghost btn-sm" onClick={()=>{setSelectedQuiz(null); setSubmitted(false);}}><i className="fas fa-times"></i></button>
                  </div>
                </div>
                {selectedQuiz.questions.map((q,idx)=> (
                  <div key={q.id} style={{padding:'20px',borderBottom:'1px solid var(--border-light)',background:idx%2===0?'var(--bg-primary)':'transparent',borderRadius:'12px',marginBottom:'8px'}}>
                    <p style={{fontWeight:700,marginBottom:'12px',fontSize:'15px'}}><span style={{color:'var(--primary)'}}>Q{idx+1}.</span> {q.text}</p>
                    <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                      {q.options.map((opt,oi)=> (
                        <label key={oi} style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 14px',borderRadius:'10px',border:'1.5px solid var(--border-color)',cursor:'pointer',transition:'all 0.2s',background:answers[q.id]===oi?'var(--primary)':'var(--bg-card)',color:answers[q.id]===oi?'white':'var(--text-primary)'}}>
                          <input type="radio" name={`q-${q.id}`} checked={answers[q.id]===oi} onChange={()=>handleAnswer(q.id,oi)} style={{accentColor:'white'}} />
                          {opt}
